name: Application tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify production data is not in the checkout
        run: python -c "from pathlib import Path; assert not Path('data').exists(), 'Production data must stay outside Git'"
      - name: Run offline tests with generated fixtures
        run: python -m unittest discover -s tests
