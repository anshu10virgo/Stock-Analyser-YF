name: Application quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - name: Verify production data is not in the checkout
        run: python -c "from pathlib import Path; assert not Path('data').exists(), 'Production data must stay outside Git'"
      - name: Run Ruff
        run: python -m ruff check src/stock_analyser tests
      - name: Enforce architecture and compatibility boundaries
        run: python -m pytest tests/integration/test_architecture_boundaries.py

  unit:
    name: Domain, application, and agent unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/domain tests/application tests/agents

  infrastructure:
    name: Offline adapter and operational integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/infrastructure tests/integration/test_operational_jobs.py

  regression:
    name: Scanner, Backtester, and report regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: >-
          python -m pytest
          tests/integration/test_scanner.py
          tests/integration/test_backtest_service.py
          tests/integration/test_scan_report.py

  presentation-smoke:
    name: Streamlit presentation smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/integration/presentation

  coverage:
    name: Full suite and coverage threshold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: >-
          python -m pytest
          --cov=src/stock_analyser
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
