name: Refresh R2 market data

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - classifications
          - validate
          - notification-test
      reference_run_url:
        description: "Optional failed run URL included in a notification test"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: r2-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: ${{ github.event.inputs.mode != 'notification-test' }}
        run: python -m pip install -r requirements.txt

      - name: Refresh or validate snapshot
        if: ${{ github.event.inputs.mode != 'notification-test' }}
        env:
          REFRESH_MODE: ${{ github.event.inputs.mode || 'incremental' }}
          R2_PUBLISHER_CONFIG: ${{ secrets.R2_PUBLISHER_CONFIG }}
        run: python -u -m stock_analyser.jobs.market_refresh --config-source github --mode "$REFRESH_MODE"

      - name: Report R2 storage usage
        if: ${{ github.event.inputs.mode != 'notification-test' }}
        env:
          R2_PUBLISHER_CONFIG: ${{ secrets.R2_PUBLISHER_CONFIG }}
        run: python -m stock_analyser.jobs.storage_housekeeping --config-source github

      - name: Save refresh reports
        if: ${{ always() && github.event.inputs.mode != 'notification-test' }}
        uses: actions/upload-artifact@v4
        with:
          name: r2-market-refresh-report
          path: |
            .snapshot-cache/market-refresh/IN/*/refresh_report.json
            .snapshot-cache/refresh_failure.json
            .snapshot-cache/housekeeping-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Email refresh failure
        if: ${{ failure() || github.event.inputs.mode == 'notification-test' }}
        env:
          REFRESH_SMTP_USERNAME: anshu10virgo@gmail.com
          REFRESH_SMTP_APP_PASSWORD: ${{ secrets.REFRESH_SMTP_APP_PASSWORD }}
          REFRESH_ALERT_RECIPIENT: anshu10virgo@gmail.com
          REFRESH_ALERT_IS_TEST: ${{ github.event.inputs.mode == 'notification-test' }}
          REFRESH_ALERT_REFERENCE_RUN_URL: ${{ github.event.inputs.reference_run_url }}
        run: python -m stock_analyser.jobs.refresh_alert
