name: Refresh committed Screener fundamentals

on:
  schedule:
    - cron: "0 22 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "refresh"
        type: choice
        options:
          - refresh
          - validate

permissions:
  contents: write

concurrency:
  group: committed-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh or validate Screener snapshot
        env:
          REFRESH_MODE: ${{ github.event.inputs.mode || 'refresh' }}
        run: python scripts/refresh_screener_fundamentals.py --mode "$REFRESH_MODE"

      - name: Validate refreshed snapshot
        if: ${{ github.event.inputs.mode != 'validate' }}
        run: python scripts/refresh_screener_fundamentals.py --mode validate

      - name: Commit changed Screener data
        if: ${{ github.event.inputs.mode != 'validate' }}
        run: |
          if [ -z "$(git status --porcelain -- data/market_data/screener)" ]; then
            echo "No Screener data changes to commit."
            exit 0
          fi
          git config user.name "stock-analyser-data-bot"
          git config user.email "stock-analyser-data-bot@users.noreply.github.com"
          git add data/market_data/screener
          git commit -m "Refresh committed Screener fundamentals $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Email refresh failure
        if: ${{ failure() }}
        env:
          REFRESH_SMTP_USERNAME: anshu10virgo@gmail.com
          REFRESH_SMTP_APP_PASSWORD: ${{ secrets.REFRESH_SMTP_APP_PASSWORD }}
          REFRESH_ALERT_RECIPIENT: anshu10virgo@gmail.com
        run: python scripts/send_refresh_failure_email.py
