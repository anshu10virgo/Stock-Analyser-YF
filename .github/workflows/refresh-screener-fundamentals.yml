name: Refresh R2 Screener fundamentals

on:
  schedule:
    - cron: "0 22 1 * *"
    - cron: "0 22 2 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "refresh"
        type: choice
        options:
          - refresh
          - validate
      retry_failed:
        description: "Retry failed checkpoint records along with pending stocks"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: r2-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh or validate Screener snapshot
        env:
          REFRESH_MODE: ${{ github.event.inputs.mode || 'refresh' }}
          RETRY_FAILED: ${{ github.event.inputs.retry_failed || 'false' }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          R2_PUBLISHER_CONFIG: ${{ secrets.R2_PUBLISHER_CONFIG }}
        run: |
          OPTIONS=()
          if [ "$SCHEDULE_EXPRESSION" = "0 22 2 * *" ]; then
            RETRY_FAILED=true
          fi
          if [ "$RETRY_FAILED" = "true" ] && [ "$REFRESH_MODE" = "refresh" ]; then
            OPTIONS+=(--retry-failed)
          fi
          python -u -m stock_analyser.jobs.market_refresh --config-source github --dataset screener --mode "$REFRESH_MODE" "${OPTIONS[@]}"

      - name: Report R2 storage usage
        env:
          R2_PUBLISHER_CONFIG: ${{ secrets.R2_PUBLISHER_CONFIG }}
        run: python -m stock_analyser.jobs.storage_housekeeping --config-source github

      - name: Save refresh reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r2-screener-refresh-report
          path: |
            .snapshot-cache/screener-refresh/IN/*/refresh_report.json
            .snapshot-cache/screener-refresh/IN/*/data/market_data/screener/.staging/**
            .snapshot-cache/refresh_failure.json
            .snapshot-cache/housekeeping-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Email refresh failure
        if: ${{ failure() }}
        env:
          REFRESH_SMTP_USERNAME: anshu10virgo@gmail.com
          REFRESH_SMTP_APP_PASSWORD: ${{ secrets.REFRESH_SMTP_APP_PASSWORD }}
          REFRESH_ALERT_RECIPIENT: anshu10virgo@gmail.com
        run: python -m stock_analyser.jobs.refresh_alert
